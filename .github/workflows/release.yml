name: Release Obsidian Plugin

on:
  # Tag-triggered so the build-provenance attestation is signed from the release
  # TAG (refs/tags/x.y.z). Obsidian's directory binds the attestation's source to
  # the release tag; a branch ref fails that verification. codebase-basecamp
  # pushes the tag directly (same flow as obsidian-readability-compass).
  push:
    tags:
      - "*"
  # Manual fallback from the Actions tab (note: runs on the dispatched ref, so
  # dispatch from the tag if you need matching provenance).
  workflow_dispatch:
    inputs:
      version:
        description: "Bare version to release (must match a CHANGELOG section), e.g. 0.1.0"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build the plugin from this repo's source
        # main.js is NOT committed; it is built here so the build-provenance
        # attestation genuinely proves the release asset was built from this
        # repository's source (the Obsidian directory verifies exactly this).
        run: |
          npm ci
          npm run build
      - name: Determine version
        # Tag push: the tag is the bare version. Manual dispatch: take the input.
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          VERSION="${VERSION_INPUT:-${GITHUB_REF_NAME}}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: The manifest must agree with the version being released
        # Catches building the wrong source: a manual dispatch runs on
        # whatever ref it was started from, and dispatching "0.1.1" from a
        # main that still carries 0.1.0 produced a release whose assets said
        # 0.1.0 (26 aug 2026). The normal path — the sync workflow in the
        # source repo pushing the tag — always satisfies this check.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$MANIFEST" != "$VERSION" ]; then
            echo "::error::manifest.json says $MANIFEST but this run is releasing $VERSION — this ref does not hold the $VERSION source. Run the sync workflow in the source repo instead."
            exit 1
          fi

      - name: Extract release notes for this version
        # Pull just this version's section out of CHANGELOG.md for use as the
        # release body. Falls back to an empty body so the auto-generated
        # notes still appear.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          : > RELEASE_NOTES.md
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              $0 ~ ("^## \\[" v "\\]") { f=1; next }
              /^## \[/ && f { exit }
              f { print }
            ' CHANGELOG.md > RELEASE_NOTES.md
          fi
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
